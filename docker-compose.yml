services:
  postgis:
    build:
      context: .
      dockerfile: domains/Boundary/persistence/docker/postgis/Dockerfile
    container_name: electioneer-postgis
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: electioneer
    volumes:
      - postgis-data:/var/lib/postgresql/data
      - ./domains/Boundary/persistence/docker/postgis/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
      - ./domains/Boundary/persistence/sql/sample-imports:/imports:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


# ------------------------------------------------------------------
  # GO Feature Flag relay proxy (self-hosted OpenFeature provider)
  # ------------------------------------------------------------------
  goff-relay:
    build: 
      context: .
      dockerfile: infra/flagging/goff/relay-proxy/Dockerfile
    container_name: electioneer-goff-relay
    restart: unless-stopped
    command: /go-feature-flag
      start 
      --uri file:/etc/opt/goff/config.yaml
      --port 8013
    volumes:
      - ./infra/flagging/goff/goff-proxy.yaml:/etc/opt/goff/goff-proxy.yaml:ro
      - ./infra/config/goff/flags.goff.yaml:/goff/flags.goff.yaml:ro  # ← Fixed: exact path + .goff.yaml
    ports:
      - "8013:8013"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8013/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

