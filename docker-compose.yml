  # vault (HashiCorp Vault for secret management)  
  vault:
    image: hashicorp/vault:1.15  # Latest stable version; pin as needed
    container_name: electioneer-vault
    ports:
      - "8200:8200"  # Expose Vault API/UI on localhost:8200
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "dev-root-token"  # Fixed root token for dev (change in prod)
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"  # For internal access
    cap_add:
      - IPC_LOCK  # Required for Vault's mlock (memory locking)
    volumes:
      - vault-data:/vault/file  # Persist secrets across restarts
      - ./config/vault:/vault/config  # Mount custom config if needed (e.g., policies)
    command: "server -dev"  # Dev mode: auto-unseals, in-memory storage
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 3



volumes:
  vault-data:
    driver: local
  postgis-data:
    driver: local  

networks:
  default:
    name: electioneer-network
    driver: bridge
