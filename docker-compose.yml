services:
  postgis:
    build:
      context: .
      dockerfile: domains/Boundary/persistence/docker/postgis/Dockerfile
    container_name: electioneer-postgis
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: electioneer
    volumes:
      - postgis-data:/var/lib/postgresql/data
      - ./domains/Boundary/persistence/docker/postgis/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
      - ./domains/Boundary/persistence/sql/sample-imports:/imports:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


# ------------------------------------------------------------------
  # GO Feature Flag relay proxy (self-hosted OpenFeature provider)
  # ------------------------------------------------------------------
  goff-relay:
    image: ghcr.io/open-feature/flagd-goff:latest
    container_name: electioneer-goff-relay
    restart: unless-stopped
    command: |
      start
      --uri file:/etc/goff/config.yaml
      --port 8013
    volumes:
      - ./infra/flagging/goff/config.yaml:/etc/goff/config.yaml:ro
    ports:
      - "8013:8013"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8013/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ------------------------------------------------------------------
  # Future services (commented but ready to go)
